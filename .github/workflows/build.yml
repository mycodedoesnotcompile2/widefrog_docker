name: Build and publish
on:
  workflow_dispatch
  # schedule:
  #   - cron:  '10 02 * * *'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: widefrog
  
  BUILDKIT_PROGRESS: plain
  FORCE_COLOR: "1"
  TERM: xterm-256color

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      # - name: Free runner disk space
      #   shell: bash
      #   run: |
      #     set -eux
      
      #     echo "[+] before cleanup"
      #     sudo fdisk -l
      #     sudo df -h
      
      #     docker system df
      #     docker system prune -af >/dev/null || true
      #     docker builder prune -af >/dev/null || true
      
      #     sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/julia* /opt/hostedtoolcache /opt/microsoft /opt/google /opt/az /usr/local/.ghcup /usr/share/swift /usr/lib/jvm /usr/local/share/chromium /usr/local/share/powershell /usr/local/graalvm/ /usr/local/lib/node_modules
      
      #     echo "[+] after cleanup"
      #     df -h
          
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set build tag
        id: meta
        run: |
          echo "tag=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}

  cleanup:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: widefrog

    steps:
      - name: Clean up old image versions
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          packages: ${{ matrix.name }}
          exclude-tags: latest
          keep-n-tagged: 3
          delete-untagged: true
          delete-orphaned-images: true
          dry-run: false
          validate: true
