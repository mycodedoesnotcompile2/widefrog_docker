
name: Build and publish

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '10 02 * * *'

permissions:
  contents: read
  #packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: widefrog

  BUILDKIT_PROGRESS: plain
  FORCE_COLOR: "1"
  TERM: xterm-256color

# Prevent overlapping runs from publishing conflicting tags.
concurrency:
  group: build-and-publish
  cancel-in-progress: false

jobs:
  build-amd64:
    name: Build amd64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push amd64
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:build-${{ github.run_id }}-amd64

  build-arm64:
    name: Build arm64
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push arm64
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:build-${{ github.run_id }}-arm64

  merge:
    name: Publish multi-platform image
    needs:
      - build-amd64
      - build-arm64
    runs-on: ubuntu-latest

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set build tag
        id: meta
        run: echo "tag=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create multi-platform manifest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          RUN_ID: ${{ github.run_id }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:latest" \
            --tag "$IMAGE:$TAG" \
            "$IMAGE:build-$RUN_ID-amd64" \
            "$IMAGE:build-$RUN_ID-arm64"

      - name: Remove temporary architecture tags
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE: ${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail

          for arch in amd64 arm64; do
            tag="build-${RUN_ID}-${arch}"

            echo "Removing temporary tag: $tag"

            gh api \
              --method DELETE \
              "/orgs/${OWNER}/packages/container/${PACKAGE}/versions" \
              -f package_type=container \
              -f tag_name="$tag" \
              2>/dev/null || true
          done

  cleanup:
    name: Clean up old image versions
    needs: merge
    runs-on: ubuntu-latest

    permissions:
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: widefrog

    steps:
      - name: Clean up old image versions
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          packages: ${{ matrix.name }}
          exclude-tags: latest
          keep-n-tagged: 3
          delete-untagged: true
          delete-orphaned-images: true
          dry-run: false
          validate: true
